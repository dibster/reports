<script>
(() => {
  const SALT = "3sB7+Yjd/GGz64RJ/JxLsg==", IV = "ZuL5cS4MJIGIZkyP", ITER = 250000;
  const STORE = "tv-gate-passcode";
  const payload = document.getElementById("gate-payload").textContent.trim();
  const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const form = document.getElementById("gate-form");
  const field = document.getElementById("gate-pass");
  const button = document.getElementById("gate-open");
  const error = document.getElementById("gate-err");
  const card = document.getElementById("gate-card");
  if (!globalThis.crypto?.subtle) {
    card.hidden = false;
    error.textContent = "This browser cannot decrypt the page. Open the link over https.";
    button.disabled = true;
    return;
  }
  const unlock = async (code) => {
    const material = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64d(SALT), iterations: ITER, hash: "SHA-256" },
      material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(IV) }, key, b64d(payload));
    document.open();
    document.write(new TextDecoder().decode(plain));
    document.close();
  };
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    error.textContent = "";
    button.disabled = true;
    button.textContent = "Opening…";
    try {
      await unlock(field.value);
      try { sessionStorage.setItem(STORE, field.value); } catch {}
    } catch {
      error.textContent = "That passcode is not correct.";
      button.disabled = false;
      button.textContent = "Open";
      field.select();
    }
  });
  let saved;
  try { saved = sessionStorage.getItem(STORE); } catch {}
  if (saved) {
    button.disabled = true;
    unlock(saved).catch(() => {
      try { sessionStorage.removeItem(STORE); } catch {}
      button.disabled = false;
      card.hidden = false;
      field.focus();
    });
  } else {
    card.hidden = false;
    field.focus();
  }
})();
</script>
