<script>

      try { sessionStorage.setItem(STORE, field.value); } catch {}

      field.select();

    unlock(saved).catch(() => {
      try { sessionStorage.removeItem(STORE); } catch {}
      button.disabled = false;
      card.hidden = false;
      field.focus();
    });
  } else {
    card.hidden = false;
    field.focus();
  }
})();
</script>
</body>
</html>
